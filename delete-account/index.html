<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KepKep — удаление учётной записи</title>
<style>
  :root {
    --bg: #f4f4f2; --card: #ffffff; --t1: #1d1d1b; --t2: #5d5d58; --line: #e3e3df;
    --accent: #2f6f5e; --accent-fg: #ffffff; --danger: #b3261e; --danger-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1f1f1d; --t1: #ecece8; --t2: #a6a6a0; --line: #33332f;
      --accent: #7cc4ae; --accent-fg: #0e1a16; --danger: #f2b8b5; --danger-fg: #3b0a08;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--t1);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 34rem; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 12px; }
  p { margin: 0 0 12px; color: var(--t2); }
  p strong { color: var(--t1); }
  .lang { margin-bottom: 20px; font-size: 0.9rem; }
  .lang button { background: none; border: 0; padding: 4px 0; margin-right: 16px; color: var(--t2); cursor: pointer;
    font: inherit; text-decoration: underline; }
  .lang button[aria-pressed="true"] { color: var(--t1); text-decoration: none; font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px 16px; margin: 20px 0; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input {
    width: 100%; font: inherit; color: var(--t1); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px; margin-bottom: 12px;
  }
  input.code { font-size: 1.4rem; letter-spacing: 0.3em; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button.main, button.danger {
    font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 20px; min-height: 48px; cursor: pointer;
  }
  button.main { background: var(--accent); color: var(--accent-fg); }
  button.danger { background: var(--danger); color: var(--danger-fg); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.word { background: none; border: 0; color: var(--t2); font: inherit; padding: 12px 4px; cursor: pointer;
    text-decoration: underline; }
  .say { min-height: 1.5em; margin-top: 12px; color: var(--t1); }
  .say.bad { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="lang" role="group" aria-label="Язык · Language">
    <button type="button" data-lang="ru">Русский</button>
    <button type="button" data-lang="en">English</button>
  </div>

  <h1 data-t="title"></h1>
  <p data-t="lead"></p>
  <p data-t="what"></p>
  <p data-t="kept"></p>

  <section class="card" id="mail-step">
    <form id="mail-form" novalidate>
      <label for="mail" data-t="mailLabel"></label>
      <input id="mail" type="email" autocomplete="email" inputmode="email" required>
      <div class="row"><button class="main" type="submit" id="mail-go" data-t="mailGo"></button></div>
    </form>
  </section>

  <section class="card" id="code-step" hidden>
    <form id="code-form" novalidate>
      <p data-t="sent"></p>
      <label for="code" data-t="codeLabel"></label>
      <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
      <p><strong data-t="warn"></strong></p>
      <div class="row">
        <button class="danger" type="submit" id="code-go" data-t="codeGo" disabled></button>
        <button class="word" type="button" id="other" data-t="other"></button>
      </div>
    </form>
  </section>

  <section class="card" id="done-step" hidden>
    <p><strong data-t="done"></strong></p>
  </section>

  <p class="say" id="say" role="status" aria-live="polite"></p>
</main>

<script>
(function () {
  "use strict";

  // Метки заменяет tools/site/fill_delete_page.py. Незаменённая — страница не настроена и в сеть не ходит.
  var PROJECT = "https://minsjoxioecltajvlcif.supabase.co";
  var KEY = "sb_publishable_upuznJBKe_NuYzyPEE111A_iw87ppTe";
  var READY = PROJECT.indexOf("__") !== 0 && KEY.indexOf("__") !== 0;

  var WORDS = {
    ru: {
      title: "Удаление учётной записи KepKep",
      lead: "Здесь учётную запись KepKep можно удалить без приложения. В приложении то же самое: «Ещё» → строка учётной записи → «Удалить учётную запись».",
      what: "Удаляются учётная запись — почта и вход через Google — и суточный счёт распознавания голоса. Сразу и насовсем: вернуть учётную запись будет нельзя.",
      kept: "Остаются ваши записи на телефоне: они хранятся на нём, а не в облаке.",
      mailLabel: "Почта учётной записи",
      mailGo: "Получить код",
      sent: "Если учётная запись с этой почтой есть, код придёт письмом в течение минуты. Письмо — о входе в KepKep: код тот же.",
      codeLabel: "Код из письма",
      warn: "Учётная запись удалится насовсем.",
      codeGo: "Удалить учётную запись",
      other: "Другая почта",
      done: "Учётная запись удалена. Записи на ваших телефонах остались.",
      sending: "Отправка…",
      deleting: "Удаление…",
      badMail: "Это не похоже на почту.",
      noNet: "Нет связи с сервером — проверьте сеть и попробуйте снова.",
      wrongCode: "Код не подошёл — проверьте его или получите новый.",
      later: "Сейчас не вышло, учётная запись цела. Попробуйте позже.",
      notSet: "Страница не настроена."
    },
    en: {
      title: "Delete your KepKep account",
      lead: "You can delete your KepKep account here without the app. In the app it is the same: More → the account row → Delete account.",
      what: "This deletes your account — the email and Google sign-in — and the daily voice recognition count. Right away and for good: the account can't be restored.",
      kept: "Your entries on your phone stay: they are stored on the phone, not in the cloud.",
      mailLabel: "Account email",
      mailGo: "Get a code",
      sent: "If there is an account with this email, a code will arrive by email within a minute. The email is about signing in to KepKep — the code is the same.",
      codeLabel: "Code from the email",
      warn: "The account will be deleted for good.",
      codeGo: "Delete account",
      other: "Different email",
      done: "Account deleted. Your entries on your phones stay.",
      sending: "Sending…",
      deleting: "Deleting…",
      badMail: "This doesn't look like an email address.",
      noNet: "Can't reach the server — check your connection and try again.",
      wrongCode: "The code didn't work — check it or get a new one.",
      later: "That didn't work, and the account is untouched. Please try again later.",
      notSet: "This page is not set up."
    }
  };

  var lang = (navigator.language || "en").toLowerCase().indexOf("ru") === 0 ? "ru" : "en";
  var mail = "";
  // Токен, полученный за код. Повтор после потерянного ответа идёт с ним, а не с кодом: код уже потрачен, и повтор с ним
  // сказал бы «код не подошёл» об учётной записи, которая уже удалена (функция отвечает таким «удалено»).
  var token = null;
  var $ = function (id) { return document.getElementById(id); };

  function t(name) { return WORDS[lang][name]; }

  function paint() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-t]").forEach(function (node) { node.textContent = t(node.getAttribute("data-t")); });
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
  }

  function say(name, bad) {
    var node = $("say");
    node.textContent = name ? t(name) : "";
    node.className = "say" + (bad ? " bad" : "");
  }

  /** Одна «@», имя до неё, домен с точкой не с краю — та же проверка, что у приложения (looksLikeMail). */
  function looksLikeMail(text) {
    var at = text.indexOf("@");
    return at > 0 && at === text.lastIndexOf("@") && !/\s/.test(text) && text.indexOf(".", at) > at + 1 &&
      text.charAt(text.length - 1) !== ".";
  }

  function ask(path, body, token) {
    var headers = { "apikey": KEY, "Content-Type": "application/json" };
    if (token) headers["Authorization"] = "Bearer " + token;
    return fetch(PROJECT.replace(/\/$/, "") + path, { method: "POST", headers: headers, body: JSON.stringify(body || {}) });
  }

  function busy(button, word) {
    button.disabled = true;
    button.textContent = t(word);
  }

  function idle(button, word) {
    button.disabled = false;
    button.textContent = t(word);
  }

  $("mail-form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!READY) return say("notSet", true);
    var to = $("mail").value.trim();
    if (!looksLikeMail(to)) return say("badMail", true);
    var go = $("mail-go");
    busy(go, "sending");
    say("");
    // Письмо — без заведения новой учётной записи: страница удаления новых людей не заводит. Ответ сервера странице не
    // виден — ни «такой почты нет», ни «рано» (его получает только зарегистрированная почта): тот же шаг кода, иначе по
    // ответу узнавали бы, чья почта зарегистрирована. Письмо, ушедшее меньше минуты назад, несёт годный код.
    ask("/auth/v1/otp", { email: to, create_user: false }).then(function () {
      mail = to;
      token = null;
      $("mail-step").hidden = true;
      $("code-step").hidden = false;
      $("code").focus();
    }).catch(function () {
      say("noNet", true);
    }).finally(function () {
      idle(go, "mailGo");
    });
  });

  $("code").addEventListener("input", function () {
    var digits = this.value.replace(/\D/g, "").slice(0, 6);
    if (digits !== this.value) this.value = digits;
    $("code-go").disabled = digits.length !== 6;
  });

  $("other").addEventListener("click", function () {
    token = null;
    $("code").value = "";
    $("code-go").disabled = true;
    $("code-step").hidden = true;
    $("mail-step").hidden = false;
    say("");
    $("mail").focus();
  });

  $("code-form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!READY) return say("notSet", true);
    var code = $("code").value;
    if (!/^[0-9]{6}$/.test(code)) return;
    var go = $("code-go");
    busy(go, "deleting");
    say("");
    var signed = token ? Promise.resolve(token) : ask("/auth/v1/verify", { type: "email", email: mail, token: code })
      .then(function (r) {
        if (!r.ok) throw { word: r.status >= 500 ? "later" : "wrongCode" };
        return r.json();
      }).then(function (session) {
        if (!session || !session.access_token) throw { word: "wrongCode" };
        token = session.access_token;
        return token;
      });
    signed.then(function (bearer) {
      return ask("/functions/v1/delete-account", {}, bearer);
    }).then(function (r) {
      if (r.status === 401) throw { word: "wrongCode" };
      if (!r.ok) throw { word: "later" };
      $("code-step").hidden = true;
      $("done-step").hidden = false;
    }).catch(function (problem) {
      say(problem && problem.word ? problem.word : "noNet", true);
      idle(go, "codeGo");
    });
  });

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-lang"); paint(); say(""); });
  });

  paint();
  if (!READY) say("notSet", true);
})();
</script>
</body>
</html>
